name: Feature request
description: Track deferred archive-platform work.
title: "[Feature]: "
labels: ["enhancement", "archive-platform"]
body:
  - type: textarea
    id: need
    attributes:
      label: Need
      description: What archival, public, or internal workflow does this support?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true when this is complete?
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risks
      description: Security, privacy, preservation, migration, or accessibility risks.
